name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check key integrity
        run: |
          echo "Lines in key: $(cat ~/.ssh/deploy_key | wc -l)"
          echo "Key starts with:"
          head -1 ~/.ssh/deploy_key
          echo "Key ends with:"
          tail -1 ~/.ssh/deploy_key
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod tidy
          go build -o medicalbot cmd/main.go

      - name: Debug SSH setup
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Сохраняем ключ
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Debug: посмотрим что сохранилось
          echo "=== Key info ==="
          ls -la ~/.ssh/deploy_key
          echo "First 2 lines of key:"
          head -2 ~/.ssh/deploy_key
          echo "Last 2 lines of key:"
          tail -2 ~/.ssh/deploy_key
          echo "=== End key info ==="
          
          # Добавим хост
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection with verbose
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -v \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} "echo '✅ SSH successful'" || true

      - name: Deploy application
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "🚀 Starting deployment..."
            cd /home/medicalbot/backend/medicalbot
          
            sudo systemctl stop medicalbot.service || true
            git fetch origin
            git reset --hard origin/stage
          
            echo "📁 Files in migrations:"
            ls -la migrations/
          
            go mod tidy
            go build -o medicalbot cmd/main.go
            sudo systemctl start medicalbot.service
          
            echo "✅ Deployment completed!"
          EOF