name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Build application
      run: |
        go mod tidy
        go build -o medicalbot cmd/main.go
        
    - name: Deploy to VM
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          cd /home/backend/medicalbot
          git pull origin stage
          go mod tidy
          go build -o medicalbot cmd/main.go
          sudo systemctl restart medicalbot.service