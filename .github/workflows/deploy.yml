name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod tidy
          go build -o medicalbot cmd/main.go

      - name: Test SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Тест подключения
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
              "echo '✅ SSH Connection successful'"

      - name: Deploy via Git Pull
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
              "cd /home/medicalbot/backend/medicalbot && \
               sudo systemctl stop medicalbot.service || true && \
               git fetch origin && \
               git reset --hard origin/stage && \
               echo '📁 Files after git reset:' && \
               ls -la migrations/ && \
               go mod tidy && \
               go build -o medicalbot cmd/main.go && \
               sudo systemctl start medicalbot.service && \
               echo '✅ Deployment completed'"