name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod tidy
          go build -o medicalbot cmd/main.go

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "."
          target: "/home/medicalbot/backend/medicalbot"
          strip_components: 1

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment..."
            cd /home/medicalbot/backend/medicalbot
            
            # Останавливаем сервис
            sudo systemctl stop medicalbot.service || true
            
            # Проверяем что ВСЕ файлы скопировались
            echo "📁 Checking ALL files..."
            ls -la
            echo "📁 Migrations:"
            ls -la migrations/
            echo "📁 Total migration files:"
            ls -la migrations/ | wc -l
            
            # Устанавливаем зависимости
            go mod tidy
            
            # Собираем приложение
            go build -o medicalbot cmd/main.go
            
            # Запускаем сервис
            sudo systemctl start medicalbot.service
            
            echo "✅ Deployment completed!"