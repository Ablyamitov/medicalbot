name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod tidy
          go build -o medicalbot cmd/main.go


      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/github_actions_deploy \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
            "echo '✅ SSH connection successful'"


      - name: Deploy application
        run: |
          ssh -i ~/.ssh/github_actions_deploy \
              -o StrictHostKeyChecking=no \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            echo "🚀 Starting deployment..."
            cd /root/backend/medicalbot

            sudo systemctl stop medicalbot.service || true
            git fetch origin stage
            git reset --hard origin/stage

            echo "📁 Files in migrations:"
            ls -la migrations/ || true

            go mod tidy
            go build -o medicalbot cmd/main.go
            sudo systemctl start medicalbot.service

            echo "✅ Deployment completed successfully!"
          EOF