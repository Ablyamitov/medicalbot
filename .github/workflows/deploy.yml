name: Deploy to VM

on:
  push:
    branches: [ stage ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build application
        run: |
          go mod tidy
          go build -o medicalbot cmd/main.go

      - name: Setup SSH key properly
        run: |
          mkdir -p ~/.ssh
          # Убедимся что ключ сохраняется правильно
          cat << 'EOF' > ~/.ssh/deploy_key
          ${{ secrets.VM_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          
          # Проверим формат ключа
          echo "🔍 Checking key format..."
          file ~/.ssh/deploy_key
          head -2 ~/.ssh/deploy_key
          
          # Добавим хост в known_hosts
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o BatchMode=yes \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} \
              "echo '✅ SSH connection successful'"

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "🚀 Starting deployment..."
            cd /home/medicalbot/backend/medicalbot
          
            # Останавливаем сервис
            sudo systemctl stop medicalbot.service || true
          
            # Обновляем код
            git fetch origin
            git reset --hard origin/stage
          
            # Проверяем файлы
            echo "📁 Current directory:"
            pwd
            echo "📁 Files in migrations/:"
            ls -la migrations/
            echo "📁 Total .sql files:"
            find migrations/ -name "*.sql" | wc -l
          
            # Собираем приложение
            go mod tidy
            go build -o medicalbot cmd/main.go
          
            # Запускаем сервис
            sudo systemctl start medicalbot.service
          
            echo "✅ Deployment completed!"
          EOF